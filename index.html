<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyFun - WinSphere Gaming & Rewards Hub</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #06040d;
            --bg-card: rgba(22, 16, 38, 0.75);
            --primary-orange: #ff5e1e;
            --primary-purple: #7a22ff;
            --neon-glow: rgba(255, 94, 30, 0.4);
            --text-main: #ffffff;
            --text-sub: #a19bb8;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(122, 34, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 94, 30, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 70px;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Header & User Profile */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 12px 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-box {
            position: relative;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary-orange);
            box-shadow: 0 0 10px var(--neon-glow);
            overflow: hidden;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-text h4 {
            font-size: 15px;
            font-weight: 700;
        }

        .user-text p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .stats-badge {
            display: flex;
            gap: 10px;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .stat-pill i {
            color: #ffd700;
        }

        /* Tournament Banner (AAA UI) */
        .hero-banner {
            position: relative;
            background: linear-gradient(135deg, #1d0938 0%, #0a0414 100%);
            border: 1px solid rgba(255, 94, 30, 0.3);
            border-radius: 24px;
            padding: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-tag {
            background: linear-gradient(90deg, var(--primary-orange), #ff9d00);
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 20px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .prize-pool {
            font-size: 24px;
            color: #ffca28;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Wheel of Fortune Section */
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .section-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--primary-orange);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--primary-orange));
        }

        canvas#wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(122, 34, 255, 0.4);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, var(--primary-orange), #ff2e63);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--neon-glow);
            transition: all 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* Adsterra Ad Spaces (Glassmorphic Container) */
        .ad-space {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            overflow: hidden;
        }

        .ad-label {
            font-size: 10px;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        /* Referral System Hub */
        .referral-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-input-group {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 6px 6px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
        }

        .link-input-group input {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .btn-copy {
            background: var(--primary-purple);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 10px
