<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickDollar - مشاهدة الإعلانات والربح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-main {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .ad-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ad-info {
            text-align: right;
        }
        .ad-title {
            font-weight: bold;
            font-size: 1.1em;
        }
        .ad-sub {
            color: #94a3b8;
            font-size: 0.9em;
        }
        .ad-btn {
            background-color: #f59e0b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>ClickDollar ⚡</h2>
        <button class="btn-main">رصيدك: $0.0000</button>
    </div>

    <h3>إعلانات اليوم المتاحة</h3>

    <div class="ad-card">
        <div class="ad-info">
            <div class="ad-title">إعلان 1</div>
            <div class="ad-sub">20 ثانية · 0.001 دولار</div>
        </div>
        <button class="ad-btn" onclick="alert('تم مشاهدة الإعلان بنجاح!')">شاهد</button>
    </div>

    <div class="ad-card">
        <div class="ad-info">
            <div class="ad-title">إعلان 2</div>
            <div class="ad-sub">20 ثانية · 0.001 دولار</div>
        </div>
        <button class="ad-btn" onclick="alert('تم مشاهدة الإعلان بنجاح!')">شاهد</button>
    </div>

</body>
</html>
